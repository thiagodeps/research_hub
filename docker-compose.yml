version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portal_backend
    ports:
      - "8000:8000"
    environment:
      - STORAGE_TYPE=postgres
      - DATABASE_URL=sqlite:///./data/test.db
    volumes:
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
    restart: unless-stopped
