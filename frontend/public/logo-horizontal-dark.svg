<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 140" width="640" height="140">
  <defs>
    <linearGradient id="hRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3E3E"/>
      <stop offset="100%" stop-color="#D91E24"/>
    </linearGradient>
    <linearGradient id="hGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C853"/>
      <stop offset="100%" stop-color="#008833"/>
    </linearGradient>
    <linearGradient id="hWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="hubAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background (Optional transparent or filled) -->
  <rect width="640" height="140" fill="#0F172A" rx="16"/>

  <!-- Logo Icon -->
  <g filter="url(#subtleShadow)">
    <!-- Top-Left: Red -->
    <path d="M 61.70 67.50 L 29.06 67.50 Q 24.06 67.50 24.50 62.50 A 56.00 56.00 0 0 1 72.50 14.50 Q 77.50 14.06 77.50 19.06 L 77.50 51.70 Q 77.50 54.20 75.00 54.80 A 16.00 16.00 0 0 0 64.80 65.00 Q 64.20 67.50 61.70 67.50 Z" fill="url(#hRed)"/>
    <!-- Top-Right: Green -->
    <path d="M 82.50 51.70 L 82.50 19.06 Q 82.50 14.06 87.50 14.50 A 56.00 56.00 0 0 1 135.50 62.50 Q 135.94 67.50 130.94 67.50 L 98.30 67.50 Q 95.80 67.50 95.20 65.00 A 16.00 16.00 0 0 0 85.00 54.80 Q 82.50 54.20 82.50 51.70 Z" fill="url(#hGreen)"/>
    <!-- Bottom-Left: Green -->
    <path d="M 77.50 88.30 L 77.50 120.94 Q 77.50 125.94 72.50 125.50 A 56.00 56.00 0 0 1 24.50 77.50 Q 24.06 72.50 29.06 72.50 L 61.70 72.50 Q 64.20 72.50 64.80 75.00 A 16.00 16.00 0 0 0 75.00 85.20 Q 77.50 85.80 77.50 88.30 Z" fill="url(#hGreen)"/>
    <!-- Bottom-Right: White -->
    <path d="M 98.30 72.50 L 130.94 72.50 Q 135.94 72.50 135.50 77.50 A 56.00 56.00 0 0 1 87.50 125.50 Q 82.50 125.94 82.50 120.94 L 82.50 88.30 Q 82.50 85.80 85.00 85.20 A 16.00 16.00 0 0 0 95.20 75.00 Q 95.80 72.50 98.30 72.50 Z" fill="url(#hWhite)" stroke="#CBD5E1" stroke-width="1.2"/>

    <!-- Center Hub -->
    <circle cx="80" cy="70" r="13" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <circle cx="80" cy="70" r="4.5" fill="url(#hubAccent)"/>
  </g>

  <!-- Typography -->
  <text x="160" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">
    Research<tspan fill="#00C853">Hub</tspan>
  </text>
  
  <text x="162" y="98" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#94A3B8" letter-spacing="1.8">
    PLATAFORMA DE INTELIGÊNCIA EM PESQUISA
  </text>
</svg>